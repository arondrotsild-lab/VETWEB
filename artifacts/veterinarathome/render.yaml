services:
  - type: web
    name: veterinarathome
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build --prefix client && npm run build --prefix server
    startCommand: NODE_ENV=production node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veterinarathome-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: veterinarathome-db
    plan: free